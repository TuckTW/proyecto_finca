{% extends 'base.html' %}

{% block title %}Editar Alimentacion{% endblock %}

{% block page_title %}
    <i class="bi bi-pencil"></i> Editar Alimentacion #{{ ali.id_alimentacion }}
    <a href="{% url 'alimentacion:listar_alimentacion' %}" class="btn btn-secondary btn-sm float-end">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Animal *</label>
                        <select name="animal" class="form-control" required>
                            {% for animal in animales %}
                            <option value="{{ animal.0 }}" {% if animal.0 == ali.id_ganado %}selected{% endif %}>{{ animal.1 }} - {{ animal.2 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tipo de Alimento *</label>
                        <input type="text" name="tipo_alimento" class="form-control" value="{{ ali.tipo_alimento }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cantidad (kg) *</label>
                        <input type="number" name="cantidad" class="form-control" step="0.01" value="{{ ali.cantidad }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha *</label>
                        <input type="date" name="fecha" class="form-control" value="{{ ali.fecha|date:'Y-m-d' }}" required>
                    </div>
                </div>
            </div>
            <hr>
            <div class="text-end">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
