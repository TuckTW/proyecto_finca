{% extends 'base.html' %}

{% block page_title %}Registrar Nuevo Cultivo{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Guardar Cultivo</button>
        <a href="{% url 'hortalizas:lista_cultivos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
