{% extends 'base.html' %}

{% block title %}Registrar Vacunación{% endblock %}

{% block page_title %}
    <i class="bi bi-plus-circle"></i> Registrar Vacunación
    <a href="{% url 'sanitario:listar_vacunas' %}" class="btn btn-secondary btn-sm float-end">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Animal *</label>
                        <select name="animal" class="form-control" required>
                            <option value="">Seleccione...</option>
                            {% for animal in animales %}
                                <option value="{{ animal.0 }}">{{ animal.1 }} - {{ animal.2 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Vacuna *</label>
                        <select name="vacuna" class="form-control" required>
                            <option value="">Seleccione...</option>
                            {% for vacuna in vacunas %}
                                <option value="{{ vacuna.0 }}">{{ vacuna.1 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha *</label>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Próxima Fecha</label>
                        <input type="date" name="proxima_fecha" class="form-control">
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Observaciones</label>
                <textarea name="observaciones" class="form-control" rows="3"></textarea>
            </div>
            <hr>
            <div class="text-end">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
